body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F1F5F9;color:#1E293B;font-size:13px}

<script>
/* ===== CONSTANTS ===== */
var CN={navy:"#4A5A8A",sky:"#3B82F6",light:"#EEF2FF",accent:"#E97730",green:"#16A34A",amber:"#EAB308",red:"#DC2626",teal:"#0D9488",muted:"#94A3B8",text:"#1E293B",border:"#E2E8F0"};
var PAGES=["Investment Overview","Delivery Systems","Market & Supply","Financing","Ecosystem & Calcium","Trend Analytics","Geographic View","Data Quality","KPI Deep Dive"];
var YLIST=[2026,2027,2028,2029,2030];
var MLIST=["All","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var QLIST=["All","Q1","Q2","Q3","Q4"];

/* ===== STATE ===== */
var S={page:0,country:"Both",years:[2026,2027,2028,2029,2030],quarter:"All",month:"All"};

/* ===== DATA ===== */
var _seed=42;
function srand(){_seed=(_seed*16807)%2147483647;return(_seed-1)/2147483646}
function sd(c,y,b){var m=(c==="Rwanda"?1.08:0.94)*(1+(y-2026)*0.19);return Math.round(b*m*(0.88+srand()*0.24))}
function getK(c,y){
  _seed=((c==="Rwanda"?7:c==="Ethiopia"?13:20)+y*31)%2147483647;
  var ml=c==="Both"?2:1;
  return[
    {id:"k1",nm:"Countries IFA→MMS",a:Math.min(sd(c,y,2*ml),8),t:Math.min(2+(y-2026)*1.5,8),u:"",p:"Delivery"},
    {id:"k2",nm:"PW Receiving MMS",a:sd(c,y,400000*ml),t:sd("t",y,500000*ml),u:"",p:"Delivery"},
    {id:"k3",nm:"MMS Coverage",a:Math.min(sd(c,y,38),95),t:Math.min(20+(y-2026)*10,60),u:"%",p:"Delivery"},
    {id:"k5",nm:"Cost per Woman",a:Math.max(sd(c,y,8),4),t:6,u:"$",p:"Delivery",inv:true},
    {id:"k6",nm:"Districts w/ MMS",a:sd(c,y,300*ml),t:sd("t",y,400*ml),u:"",p:"Delivery"},
    {id:"k7",nm:"MMS in HMIS",a:Math.min(sd(c,y,1),2),t:Math.min(1+(y-2026),2),u:"",p:"Delivery"},
    {id:"k8",nm:"Pooled Procurement",a:Math.min(sd(c,y,2*ml),8),t:Math.min(2+(y-2026)*1.5,8),u:"",p:"Market"},
    {id:"k9",nm:"MMS Cost/Course",a:+(Math.max(sd(c,y,3),1.5)).toFixed(1),t:2.1,u:"$",p:"Market",inv:true},
    {id:"k10",nm:"Costed Roadmaps",a:Math.min(sd(c,y,2*ml),8),t:Math.min(2+(y-2026)*1.5,8),u:"",p:"Financing"},
    {id:"k11",nm:"Financing Committed",a:sd(c,y,8*ml),t:sd("t",y,11*ml),u:"$M",p:"Financing"},
    {id:"k12",nm:"Continental Scorecard",a:y>=2028?1:0,t:1,u:"bool",p:"Ecosystem"},
    {id:"k13",nm:"WHO Guidelines",a:y>=2029?1:0,t:1,u:"bool",p:"Ecosystem"},
    {id:"k14",nm:"Countries Ready 2030",a:Math.min(sd(c,y,2),7),t:Math.min(1+(y-2026)*1.5,7),u:"",p:"Ecosystem"},
    {id:"k15",nm:"Calcium Integration",a:Math.min(sd(c,y,1),5),t:Math.min(1+(y-2026),5),u:"",p:"Calcium"},
    {id:"k16",nm:"Financing Plans",a:Math.min(sd(c,y,2*ml),8),t:Math.min(2+(y-2026)*1.5,8),u:"",p:"Financing"}
  ];
}

function stFn(a,t,inv){if(!t)return"green";var p=inv?(t/a)*100:(a/t)*100;return p>=90?"green":p>=70?"amber":"red"}
function pcFn(a,t,inv){if(!t)return 100;return Math.round(inv?(t/a)*100:(a/t)*100)}
function nf(v){return v>=1e6?(v/1e6).toFixed(1)+"M":v>=1000?Math.round(v/1000)+"K":v}
function fm(v){return typeof v==="number"&&v>=1000?v.toLocaleString():v}
function colr(s){return s==="green"?CN.green:s==="amber"?CN.amber:CN.red}
function fk(v,u){return u==="bool"?(v?"Yes":"No"):u==="$"?("$"+fm(v)):u==="$M"?("$"+fm(v)+"M"):u==="%"?(v+"%"):fm(v)}
function bgc(s){return s==="green"?"#F0FDF4":s==="amber"?"#FFFBEB":"#FEF2F2"}

/* ===== SVG HELPERS ===== */
function svgEl(tag,attrs,children){
  var el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  if(attrs)for(var k in attrs)el.setAttribute(k,attrs[k]);
  if(typeof children==="string")el.textContent=children;
  else if(Array.isArray(children))children.forEach(function(c){if(c)el.appendChild(c)});
  return el;
}

function mkGauge(val,max,label,color,sz){
  sz=sz||120;
  var r=sz*.35,cx=sz/2,cy=sz*.52,sw=sz*.07;
  var sa=-210,ea=30,rng=ea-sa;
  var pv=Math.min(val/max,1.15),ang=sa+rng*Math.min(pv,1);
  var tr=function(a){return a*Math.PI/180};
  var ap=function(s,e){
    var x1=cx+r*Math.cos(tr(s)),y1=cy+r*Math.sin(tr(s)),x2=cx+r*Math.cos(tr(e)),y2=cy+r*Math.sin(tr(e));
    return"M"+x1+","+y1+" A"+r+","+r+" 0 "+(e-s>180?1:0)+" 1 "+x2+","+y2;
  };
  var dv=typeof val==="number"&&val>=10000?nf(val):val;
  var svg=svgEl("svg",{width:sz,height:sz*.62,viewBox:"0 0 "+sz+" "+sz*.62},[
    svgEl("path",{d:ap(sa,ea),fill:"none",stroke:"#E8ECF0","stroke-width":sw,"stroke-linecap":"round"}),
    svgEl("path",{d:ap(sa,ang),fill:"none",stroke:color,"stroke-width":sw,"stroke-linecap":"round"}),
    svgEl("text",{x:cx,y:cy-2,"text-anchor":"middle","font-size":sz*.17,"font-weight":"800",fill:color},""+dv),
    svgEl("text",{x:cx,y:cy+sz*.1,"text-anchor":"middle","font-size":Math.min(sz*.065,9),"font-weight":"600",fill:"#94A3B8"},label)
  ]);
  return svg;
}

function mkLine(data,xKey,lines,ht,yDom){
  var w=380,h=ht||170,ml=44,mr=10,mt=12,mb=26,pw=w-ml-mr,ph=h-mt-mb;
  if(!data||!data.length)return svgEl("svg",{viewBox:"0 0 "+w+" "+h,style:"width:100%;height:"+h+"px"});
  var allV=[];lines.forEach(function(ln){data.forEach(function(d){allV.push(d[ln.key]||0)})});
  var yMin=yDom?yDom[0]:Math.floor(Math.min.apply(null,allV)*.85);
  var yMax=yDom?yDom[1]:Math.ceil(Math.max.apply(null,allV)*1.15);
  if(yMin===yMax)yMax=yMin+1;
  var ch=[];
  for(var ti=0;ti<5;ti++){
    var yy=mt+ph*ti/4,vv=yMax-(yMax-yMin)*ti/4;
    ch.push(svgEl("line",{x1:ml,y1:yy,x2:w-mr,y2:yy,stroke:"#f0f0f0","stroke-width":"1"}));
    ch.push(svgEl("text",{x:ml-4,y:yy+3,"text-anchor":"end","font-size":"9",fill:CN.muted},""+nf(Math.round(vv))));
  }
  data.forEach(function(d,i){
    var xx=data.length>1?ml+pw*i/(data.length-1):ml+pw/2;
    ch.push(svgEl("text",{x:xx,y:h-5,"text-anchor":"middle","font-size":"9",fill:CN.muted},""+d[xKey]));
  });
  lines.forEach(function(ln){
    var pts=data.map(function(d,i){
      var xx=data.length>1?ml+pw*i/(data.length-1):ml+pw/2;
      var yy2=mt+ph*(1-((d[ln.key]||0)-yMin)/(yMax-yMin));
      return[xx,yy2];
    });
    var pathD=pts.map(function(p,i){return(i===0?"M":"L")+p[0]+","+p[1]}).join(" ");
    if(ln.area){
      ch.push(svgEl("path",{d:pathD+" L"+pts[pts.length-1][0]+","+(mt+ph)+" L"+pts[0][0]+","+(mt+ph)+" Z",fill:ln.color,opacity:"0.1"}));
    }
    ch.push(svgEl("path",{d:pathD,fill:"none",stroke:ln.color,"stroke-width":"2.5","stroke-linecap":"round"}));
    pts.forEach(function(p){ch.push(svgEl("circle",{cx:p[0],cy:p[1],r:"3.5",fill:ln.color}))});
  });
  var lx=ml;
  lines.forEach(function(ln,i){
    var g=svgEl("g",{transform:"translate("+(lx+i*88)+","+(h-2)+")"});
    g.appendChild(svgEl("rect",{x:"0",y:"-5",width:"10",height:"3",rx:"1",fill:ln.color}));
    g.appendChild(svgEl("text",{x:"13",y:"-2","font-size":"8",fill:CN.muted},ln.label||ln.key));
    ch.push(g);
  });
  var svg=svgEl("svg",{viewBox:"0 0 "+w+" "+h,style:"width:100%;height:"+h+"px"},ch);
  return svg;
}

function mkBar(data,xKey,bars,ht,horiz){
  var w=380,h=ht||170;
  var ch=[];
  var maxV=0;
  data.forEach(function(d){bars.forEach(function(b){maxV=Math.max(maxV,d[b.key]||0)})});
  if(!maxV)maxV=1;
  maxV*=1.15;

  if(horiz){
    var ml=88,mr=10,mt2=8,mb2=14,pw=w-ml-mr,ph=h-mt2-mb2;
    data.forEach(function(d,i){
      var yy=mt2+i*(ph/data.length)+ph/(data.length*2);
      ch.push(svgEl("text",{x:ml-4,y:yy+4,"text-anchor":"end","font-size":"9",fill:CN.text},String(d[xKey]||"").slice(0,14)));
      var bh=Math.min(16,ph/data.length/(bars.length));
      bars.forEach(function(b,bi){
        var bw=Math.max(2,pw*((d[b.key]||0)/maxV));
        ch.push(svgEl("rect",{x:ml,y:yy-bh*bars.length/2+bi*bh,width:bw,height:bh-1,rx:"2",fill:b.color,opacity:"0.85"}));
      });
    });
    var lgx=ml;
    bars.forEach(function(b,i){
      var g=svgEl("g",{transform:"translate("+(lgx+i*80)+","+(h-2)+")"});
      g.appendChild(svgEl("rect",{x:"0",y:"-5",width:"10",height:"3",rx:"1",fill:b.color}));
      g.appendChild(svgEl("text",{x:"13",y:"-2","font-size":"8",fill:CN.muted},b.label||b.key));
      ch.push(g);
    });
  } else {
    var ml3=44,mr3=10,mt3=12,mb3=38,pw3=w-ml3-mr3,ph3=h-mt3-mb3;
    for(var gi=0;gi<5;gi++){
      var gy=mt3+ph3*(1-gi/4);
      ch.push(svgEl("line",{x1:ml3,y1:gy,x2:w-mr3,y2:gy,stroke:"#f0f0f0"}));
      ch.push(svgEl("text",{x:ml3-4,y:gy+3,"text-anchor":"end","font-size":"9",fill:CN.muted},""+nf(Math.round(maxV*gi/4))));
    }
    var bw2=Math.min(20,pw3/data.length/bars.length-2);
    data.forEach(function(d,i){
      var cx2=ml3+pw3*(i+.5)/data.length;
      ch.push(svgEl("text",{x:cx2,y:h-5,"text-anchor":"middle","font-size":"9",fill:CN.muted},String(d[xKey]||"").slice(0,5)));
      bars.forEach(function(b,bi){
        var bx=cx2-(bars.length*bw2)/2+bi*bw2;
        var bht=ph3*((d[b.key]||0)/maxV);
        ch.push(svgEl("rect",{x:bx,y:mt3+ph3-bht,width:bw2-1,height:bht,rx:"2",fill:b.color,opacity:b.opacity||"0.85"}));
      });
    });
    bars.forEach(function(b,i){
      var g=svgEl("g",{transform:"translate("+(ml3+i*80)+","+(h-2)+")"});
      g.appendChild(svgEl("rect",{x:"0",y:"-5",width:"10",height:"3",rx:"1",fill:b.color}));
      g.appendChild(svgEl("text",{x:"13",y:"-2","font-size":"8",fill:CN.muted},b.label||b.key));
      ch.push(g);
    });
  }
  return svgEl("svg",{viewBox:"0 0 "+w+" "+h,style:"width:100%;height:"+h+"px"},ch);
}

function mkDonut(data,colors,ht){
  var w=280,h=ht||170,cx=w*.38,cy=h/2,r=Math.min(cx,cy)*.7,ir=r*.55;
  var total=data.reduce(function(s,d){return s+d.value},0);
  var cum=0,ch=[];
  data.forEach(function(d,i){
    var sa=cum/total*Math.PI*2-Math.PI/2;cum+=d.value;var ea=cum/total*Math.PI*2-Math.PI/2;
    var lg=ea-sa>Math.PI?1:0;
    var x1=cx+r*Math.cos(sa),y1=cy+r*Math.sin(sa),x2=cx+r*Math.cos(ea),y2=cy+r*Math.sin(ea);
    var ix1=cx+ir*Math.cos(sa),iy1=cy+ir*Math.sin(sa),ix2=cx+ir*Math.cos(ea),iy2=cy+ir*Math.sin(ea);
    ch.push(svgEl("path",{d:"M"+x1+","+y1+" A"+r+","+r+" 0 "+lg+" 1 "+x2+","+y2+" L"+ix2+","+iy2+" A"+ir+","+ir+" 0 "+lg+" 0 "+ix1+","+iy1+" Z",fill:colors[i%colors.length],opacity:"0.85"}));
    ch.push(svgEl("rect",{x:w*.7,y:6+i*15,width:"8",height:"8",rx:"2",fill:colors[i%colors.length]}));
    ch.push(svgEl("text",{x:w*.7+11,y:13+i*15,"font-size":"8",fill:CN.text},d.name+": "+Math.round(d.value/total*100)+"%"));
  });
  return svgEl("svg",{viewBox:"0 0 "+w+" "+h,style:"width:100%;height:"+h+"px"},ch);
}

function mkRadar(data,ht){
  var w=280,h=ht||190,cx=w/2,cy=h/2,r=Math.min(cx,cy)*.55;
  var n=data.length,as=Math.PI*2/n,ch=[];
  [.25,.5,.75,1].forEach(function(f){
    var pts=data.map(function(_,i){var a=as*i-Math.PI/2;return(cx+r*f*Math.cos(a))+","+(cy+r*f*Math.sin(a))}).join(" ");
    ch.push(svgEl("polygon",{points:pts,fill:"none",stroke:"#E2E8F0","stroke-width":"0.5"}));
  });
  data.forEach(function(d,i){
    var a=as*i-Math.PI/2;
    ch.push(svgEl("line",{x1:cx,y1:cy,x2:cx+r*Math.cos(a),y2:cy+r*Math.sin(a),stroke:"#E2E8F0","stroke-width":"0.5"}));
    ch.push(svgEl("text",{x:cx+(r+18)*Math.cos(a),y:cy+(r+18)*Math.sin(a)+3,"text-anchor":"middle","font-size":"9",fill:CN.text,"font-weight":"600"},d.pillar));
  });
  var dataPts=data.map(function(d,i){var a=as*i-Math.PI/2;var rv=r*Math.min(d.score/100,1.2);return(cx+rv*Math.cos(a))+","+(cy+rv*Math.sin(a))}).join(" ");
  ch.push(svgEl("polygon",{points:dataPts,fill:CN.sky,"fill-opacity":"0.2",stroke:CN.sky,"stroke-width":"2"}));
  data.forEach(function(d,i){var a=as*i-Math.PI/2;var rv=r*Math.min(d.score/100,1.2);ch.push(svgEl("circle",{cx:cx+rv*Math.cos(a),cy:cy+rv*Math.sin(a),r:"3",fill:CN.sky}))});
  return svgEl("svg",{viewBox:"0 0 "+w+" "+h,style:"width:100%;height:"+h+"px"},ch);
}

    {ind:"Stock-outs",rw:"Spot checks",et:"EPSS",fr:"Biannual",q:"Medium",risk:"Standardize protocol",rs:60,es:48},
    {ind:"HW Trained",rw:"Partner reports",et:"Partner reports",fr:"Quarterly",q:"Medium",risk:"De-dup via IDs",rs:65,es:62},
    {ind:"Coverage %",rw:"HMIS/ANC",et:"HMIS/pop est",fr:"Monthly",q:"Medium",risk:"Denom accuracy",rs:70,es:55},
    {ind:"Financing",rw:"Budget rpt",et:"Budget rpt",fr:"Biannual",q:"Good",risk:"Source overlap",rs:80,es:76},
    {ind:"Demand-Gen",rw:"CHW rpt",et:"HEW rpt",fr:"Monthly",q:"Low",risk:"Unstandardized",rs:50,es:42},
    {ind:"Volunteers",rw:"District logs",et:"Woreda logs",fr:"Monthly",q:"Medium",risk:"Active vs trained",rs:68,es:58}
  ];
  var aR=Math.round(dq.reduce(function(s,d){return s+d.rs},0)/dq.length);
  var aE=Math.round(dq.reduce(function(s,d){return s+d.es},0)/dq.length);
  buildFilters(m);
  m.appendChild(txt("div","🛡️ Data Quality","ptitle"));
  var r1=el("div","grid g2b");
  var g1=card();g1.body.style.textAlign="center";g1.body.appendChild(mkGauge(aR,100,"Rwanda DQ",aR>=70?CN.green:CN.amber,118));g1.body.appendChild(txt("div","Avg "+dq.length+" indicators","","font-size:10px;color:#94A3B8"));r1.appendChild(g1.root);
  var g2=card();g2.body.style.textAlign="center";g2.body.appendChild(mkGauge(aE,100,"Ethiopia DQ",aE>=70?CN.green:CN.amber,118));g2.body.appendChild(txt("div","Avg "+dq.length+" indicators","","font-size:10px;color:#94A3B8"));r1.appendChild(g2.root);
  var bc=card("📊 DQ by Indicator");bc.body.appendChild(mkBar(dq.map(function(d){return{name:d.ind.slice(0,12),Rwanda:d.rs,Ethiopia:d.es}}),"name",[{key:"Rwanda",color:CN.sky,label:"Rwanda"},{key:"Ethiopia",color:CN.accent,label:"Ethiopia"}],155,true));r1.appendChild(bc.root);
  m.appendChild(r1);

  var tc=card("📋 Source Matrix");
  var tbl=el("table");
  var thead=el("thead");var tr=el("tr");
  ["Indicator","Rwanda","Ethiopia","Freq","Quality","Risk","🇷🇼","🇪🇹"].forEach(function(h2){tr.appendChild(txt("th",h2))});
  thead.appendChild(tr);tbl.appendChild(thead);
  var tbody=el("tbody");
  dq.forEach(function(d){
    var r2=el("tr");
    r2.appendChild(txt("td",d.ind,"","font-weight:600"));r2.appendChild(txt("td",d.rw));r2.appendChild(txt("td",d.et));
    var ftd=el("td");var fb=txt("span",d.fr,"bg","background:"+CN.light);ftd.appendChild(fb);r2.appendChild(ftd);
    var qtd=el("td");var qb=txt("span",d.q,"bg","background:"+(d.q==="Good"?"#F0FDF4":d.q==="Medium"?"#FFFBEB":"#FEF2F2")+";color:"+(d.q==="Good"?CN.green:d.q==="Medium"?CN.amber:CN.red));qtd.appendChild(qb);r2.appendChild(qtd);
    r2.appendChild(txt("td",d.risk,"","font-size:9px;color:#94A3B8"));
    r2.appendChild(txt("td",d.rs+"%","","font-weight:700;color:"+(d.rs>=70?CN.green:d.rs>=50?CN.amber:CN.red)));
    r2.appendChild(txt("td",d.es+"%","","font-weight:700;color:"+(d.es>=70?CN.green:d.es>=50?CN.amber:CN.red)));
    tbody.appendChild(r2);
  });
  tbl.appendChild(tbody);tc.body.appendChild(tbl);m.appendChild(tc.root);

  m.appendChild(narr("Rwanda DQ "+aR+"%, Ethiopia "+aE+"%. Priorities: harmonize counting, unique HW IDs, stock-out protocol."));

  var rc=card("🔑 Recommendations");
  var rg=el("div","grid g2","gap:6px");
  [{t:"HMIS Triangulation",d:"Cross-validate LMIS",pr:"HIGH"},{t:"HW De-dup",d:"Unique HW IDs",pr:"HIGH"},{t:"Counting Harmonization",d:"ANC-1 vs any-ANC",pr:"HIGH"},{t:"Stock-out Protocol",d:"Standardize monitoring",pr:"MED"}].forEach(function(r2){
    var d=el("div","","padding:8px;border-radius:6px;background:#F8FAFC;border:1px solid "+CN.border);

    hdr.appendChild(txt("span",r2.pr,"bg","background:"+(r2.pr==="HIGH"?"#FEF2F2":"#FFFBEB")+";color:"+(r2.pr==="HIGH"?CN.red:CN.amber)));
    d.appendChild(hdr);d.appendChild(txt("div",r2.d,"","font-size:10px;color:#94A3B8;margin-top:3px"));
    rg.appendChild(d);
  });
  rc.body.appendChild(rg);m.appendChild(rc.root);
}

function page8(m){
  var ly=Math.max.apply(null,S.years);
  var kpis=getK(S.country,ly);
  var gn=kpis.filter(function(k){return stFn(k.a,k.t,k.inv)==="green"}).length;
  var otp=Math.round(gn/kpis.length*100);
  var rdr=["Delivery","Market","Financing","Ecosystem","Calcium"].map(function(p2){var f=kpis.filter(function(k){return k.p===p2});return{pillar:p2,score:f.length?Math.round(f.reduce(function(s,k){return s+pcFn(k.a,k.t,k.inv)},0)/f.length):0}});
  buildFilters(m);
  m.appendChild(txt("div","KPI Deep Dive","ptitle"));
  var r1=el("div","grid g2");
  var ac=card("Achievement Distribution");ac.body.appendChild(mkBar(kpis.map(function(k){return{name:k.nm.slice(0,12),val:pcFn(k.a,k.t,k.inv)}}),"name",[{key:"val",color:CN.sky,label:"Ach %"}],195));r1.appendChild(ac.root);
  var rc=card("Pillar Radar");rc.body.appendChild(mkRadar(rdr,195));r1.appendChild(rc.root);
  m.appendChild(r1);

  var tc=card("");
  var tbl=el("table");
  var thead=el("thead");var tr2=el("tr");
  ["","Pillar","KPI","Actual","Target","Ach%","Var",""].forEach(function(h2,i){var th2=txt("th",h2);if(i>=3)th2.style.textAlign="right";tr2.appendChild(th2)});
  thead.appendChild(tr2);tbl.appendChild(thead);
  var tbody=el("tbody");
  kpis.forEach(function(k){
    var s=stFn(k.a,k.t,k.inv),p=pcFn(k.a,k.t,k.inv),v=k.inv?k.t-k.a:k.a-k.t;
    var r2=el("tr");
    var dtd=el("td");var dt=el("span","dot","background:"+colr(s));dtd.appendChild(dt);r2.appendChild(dtd);
    r2.appendChild(txt("td",k.p,"","font-size:9px;color:#94A3B8;font-weight:600"));
    r2.appendChild(txt("td",k.nm,"","font-weight:600"));
    r2.appendChild(txt("td",fk(k.a,k.u),"","text-align:right;font-weight:700;color:"+colr(s)));
    r2.appendChild(txt("td",fk(k.t,k.u),"","text-align:right;color:#94A3B8"));
    r2.appendChild(txt("td",p+"%","","text-align:right;font-weight:700;color:"+colr(s)));
    r2.appendChild(txt("td",(v>=0?"+":"")+(Math.abs(v)>=1000?v.toLocaleString():typeof v==="number"?v.toFixed(1):v),"","text-align:right;color:"+(v>=0?CN.green:CN.red)+";font-weight:600"));
    r2.appendChild(txt("td",ly>2026?(p>=90?"📈":p>=70?"➡️":"📉"):"🆕","","text-align:center"));
    tbody.appendChild(r2);
  });
  tbl.appendChild(tbody);tc.body.appendChild(tbl);m.appendChild(tc.root);
  m.appendChild(narr(gn+"/"+kpis.length+" on track ("+otp+"%)."));
}

/* ===== RENDER ===== */
function render(){
  // Tabs
  var tabsEl=document.getElementById("tabs");
  tabsEl.innerHTML="";
  PAGES.forEach(function(p,i){
    var b=el("button","tab"+(S.page===i?" on":""));
    b.textContent=p;b.onclick=function(){S.page=i;render()};
    tabsEl.appendChild(b);
  });
  // Main
  var mainEl=document.getElementById("main");
  mainEl.innerHTML="";
  [page0,page1,page2,page3,page4,page5,page6,page7,page8][S.page](mainEl);
}

render();
</script>
